[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rltune-boomeramg"
version = "0.1.0"
description = "Online BoomerAMG setup tuning and cycle-level solve control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.10.9",
    "mpi4py==4.1.2",
    "mpmath==1.3.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
]

[project.optional-dependencies]
dev = ["ruff==0.14.10"]
artifacts = ["reportlab==4.4.5", "pypdf==6.1.1"]

[project.urls]
Repository = "https://github.com/EriseHe/RLTune-BoomerAMG"

[tool.setuptools.packages.find]
include = ["setup*", "solve*", "problems*", "experiments*", "hypre", "hypre.bindings*"]
exclude = ["*.archive*", "*.reproduction*"]
namespaces = true

[tool.ruff]
target-version = "py310"
extend-exclude = ["hypre/source", "tmp", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
